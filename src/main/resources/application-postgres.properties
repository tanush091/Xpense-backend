# Server Port
server.port=8080

# Spring Application Name
spring.application.name=xpense-backend

# PostgreSQL / Supabase Datasource Configuration
# Values come from environment variables (see backend/.env.example):
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xpensedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver

# Small pool: Supabase's free tier allows a limited number of pooled connections
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration for PostgreSQL
# Tables are created by supabase/schema.sql; "update" only adds missing columns.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT signing secret (APP_JWT_SECRET environment variable)
app.jwt.secret=${APP_JWT_SECRET:}

# Jackson JSON naming strategy (Matches React snake_case naming)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
