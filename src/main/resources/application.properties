# Server Port
server.port=8080

# Spring Application Name
spring.application.name=xpense-backend

# Default Database: H2 in-memory with file persistence support
spring.datasource.url=jdbc:h2:mem:xpensedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson JSON naming strategy (Matches React snake_case naming)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
